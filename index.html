<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="耳鼻科Q" />
    <meta name="description" content="耳の世界を冒険する2DアクションRPG（試遊版）" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>耳鼻科クエスト（試遊版）</title>
  </head>
  <body>
    <div id="app">
      <header id="hud" hidden>
        <div class="hud-row">
          <span id="hud-name">ヒビキ</span>
          <span id="hud-lv">Lv1</span>
          <div class="bar hp"><i id="hud-hp-fill"></i><span id="hud-hp">30/30</span></div>
          <button id="btn-menu" aria-label="メニュー">☰<b id="hud-points" hidden>!</b></button>
        </div>
        <div class="hud-row sub">
          <div class="bar exp"><i id="hud-exp-fill"></i></div>
          <span id="hud-area">コンカの集落</span>
          <span id="hud-weapon">細針の刃</span>
        </div>
      </header>

      <main id="game"></main>

      <section id="controls" hidden>
        <div id="stick-zone">
          <div id="stick-base"><div id="stick-knob"></div></div>
          <p id="stick-hint">ここをなぞって移動</p>
        </div>
        <div id="buttons">
          <button id="btn-attack" class="btn big" hidden>攻撃</button>
          <button id="btn-special" class="btn"><span id="special-label">特殊</span><i id="special-cd"></i></button>
          <button id="btn-swap" class="btn">持替</button>
          <button id="btn-item" class="btn">道具<b id="item-count">3</b></button>
        </div>
      </section>

      <div id="toasts" aria-live="polite"></div>

      <div id="dialog" hidden>
        <div class="dialog-box">
          <div id="dialog-speaker"></div>
          <div id="dialog-text"></div>
          <div class="dialog-next">▼ タップで次へ</div>
        </div>
      </div>

      <div id="menu" class="panel" hidden></div>
      <div id="screen" class="panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
